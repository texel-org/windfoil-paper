<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Windfoil · WebGPU L2</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header>
      <h1>Windfoil L2</h1>
      <p>Analytic rendering and gradients in one WebGPU shader.</p>
    </header>

    <nav>
      <label>model
        <select id="mode">
          <option value="shape">shapes</option>
          <option value="line">lines</option>
        </select>
      </label>
      <label>count <input id="count" type="number" min="1" max="10000"></label>
      <label>steps <input id="steps-input" type="number" min="1"></label>
      <button id="play">pause</button>
      <button id="reset">reset</button>
      <button id="camera-button">webcam</button>
    </nav>

    <main>
      <section>
        <div class="caption"><b>target</b><span id="source-label">loading</span></div>
        <div id="drop" class="canvas"><canvas id="source"></canvas></div>
      </section>
      <section>
        <div class="caption"><b id="model-label">quadratic loops</b><span>crisp vector preview</span></div>
        <div class="canvas"><canvas id="result"></canvas></div>
      </section>
    </main>

    <div class="bar"><div id="progress"></div></div>
    <aside>
      <span>step <b id="step">–</b></span>
      <span>PSNR <b id="psnr">–</b></span>
      <span>loss <b id="loss">–</b></span>
      <span>rate <b id="rate">–</b></span>
    </aside>
    <p class="hint">Drop or click the target to choose an image. Webcam needs localhost or HTTPS.</p>
    <pre id="error"></pre>
    <input id="file" type="file" accept="image/*" hidden>
    <video id="camera" playsinline muted></video>
    <script type="module" src="./main.js"></script>
  </body>
</html>
