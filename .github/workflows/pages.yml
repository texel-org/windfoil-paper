name: Web demo

on:
  push:
    branches: [main]
    # Only what the demo bundle imports (plus its image and build setup), so
    # README and bench edits don't redeploy an unchanged demo.
    paths:
      - demos/web/**
      - demos/util/**
      - demos/lines/**
      - js/**
      - tools/web-image.js
      - fixtures/manifests/farlev-highres.json
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The default target image is fetched, not tracked; cache it so each
      # deploy doesn't re-download 14 MB from Wikimedia. web:build derives the
      # 4096 px copy the page actually ships.
      - uses: actions/cache@v6
        with:
          path: fixtures/wikimedia/farlev-dip-in-road.jpg
          key: fixtures-${{ hashFiles('fixtures/manifests/farlev-highres.json') }}
      - run: npm run fixtures:farlev
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
