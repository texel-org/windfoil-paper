name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The default target image is fetched, not tracked; cache it so each
      # deploy doesn't re-download 14 MB from Wikimedia.
      - uses: actions/cache@v6
        with:
          path: fixtures/wikimedia
          key: fixtures-${{ hashFiles('fixtures/manifests/farlev-highres.json') }}
      - run: npm run fixtures:farlev
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
